services:
  - type: web
    name: exovoicebot
    env: python
    plan: free
    branch: main
    buildCommand: "apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: GEMINI_API_KEY
        value: your-gemini-api-key
